worker_processes auto;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time urt=$upstream_response_time '
                      'cs=$upstream_cache_status';

    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log   warn;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    keepalive_requests  1000;
    server_tokens       off;

    # ------------------------------------------------------------------
    # Compresion gzip: JSON, HTML, CSS y JS viajan comprimidos
    # ------------------------------------------------------------------
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ------------------------------------------------------------------
    # Cache de respuestas (TTL 30s, ver proxy_cache_valid)
    # ------------------------------------------------------------------
    proxy_cache_path /var/cache/nginx/speedrunners
                     levels=1:2
                     keys_zone=speedrunners_cache:16m
                     max_size=256m
                     inactive=5m
                     use_temp_path=off;

    upstream speedrunners_backend {
        least_conn;

        server backend1:8000 max_fails=3 fail_timeout=10s;
        server backend2:8000 max_fails=3 fail_timeout=10s;
        server backend3:8000 max_fails=3 fail_timeout=10s;
        server backend4:8000 max_fails=3 fail_timeout=10s;

        keepalive 64;
    }

    server {
        listen 80;
        server_name _;

        # --------------------------------------------------------------
        # Metricas de conexiones para el dashboard (stub_status)
        # --------------------------------------------------------------
        location = /nginx_status {
            stub_status;
            access_log off;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny  all;
        }

        location / {
            proxy_pass         http://speedrunners_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Cache
            proxy_cache             speedrunners_cache;
            proxy_cache_key         "$scheme$request_method$host$request_uri";
            proxy_cache_valid       200 30s;
            proxy_cache_valid       404 10s;
            proxy_cache_use_stale   error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock        on;
            proxy_cache_revalidate  on;

            # Permite medir el costo real de los backends sin cache:
            #   curl "http://localhost:8000/?nocache=1"
            proxy_cache_bypass      $arg_nocache;
            proxy_no_cache          $arg_nocache;

            # Tolerancia a fallos de backend
            proxy_next_upstream         error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries   2;
            proxy_connect_timeout       2s;
            proxy_send_timeout          10s;
            proxy_read_timeout          10s;

            add_header X-Cache-Status $upstream_cache_status always;
        }
    }
}
