name: speedrunners

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: speedrunners-nginx
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
    restart: unless-stopped

  backend1:
    build: ./backends
    container_name: speedrunners-backend1
    environment:
      BACKEND_ID: backend1
      ARTIFICIAL_DELAY_MS: "500"
    restart: unless-stopped

  backend2:
    build: ./backends
    container_name: speedrunners-backend2
    environment:
      BACKEND_ID: backend2
      ARTIFICIAL_DELAY_MS: "500"
    restart: unless-stopped
